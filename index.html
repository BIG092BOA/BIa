<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BIA Gadgets | Premium Tech Emporium</title>
    <!-- Google Fonts: Beachy & modern vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #2c2f33; /* deep grey base */
            color: #f0f3f5;
            scroll-behavior: smooth;
        }

        :root {
            --bg-main: #2a2d32;
            --card-bg: #3a3f47;
            --accent: #ffb347;
            --accent-hover: #ff9f1c;
            --text-light: #f8f9fa;
            --text-muted: #b0bec5;
            --border-glow: #4e555e;
        }

        .navbar {
            background: #1e2227;
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 1px solid #414a54;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        .logo i {
            color: #ffb347;
            margin-right: 6px;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            display: flex;
            background: #2f353d;
            border-radius: 60px;
            overflow: hidden;
            border: 1px solid #5f6a76;
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            color: white;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #9aa9b9;
        }
        .search-bar button {
            background: #ffb347;
            border: none;
            padding: 0 22px;
            cursor: pointer;
            color: #1e2227;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .search-bar button:hover {
            background: #ffa01e;
        }

        .cart-icon {
            font-size: 1.5rem;
            cursor: default;
            background: #2f353d;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
        }
        .cart-icon i {
            margin-right: 8px;
            color: #ffb347;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 1rem;
            background: #23272e;
            border-bottom: 1px solid #3b424b;
            position: sticky;
            top: 72px;
            z-index: 99;
        }
        .cat-btn {
            background: #31373f;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: #eef2f5;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cat-btn i {
            font-size: 1rem;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #ffb347;
            color: #1e2227;
            transform: scale(1.02);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .products-section {
            display: none;
            padding: 2rem 2rem;
            animation: fadeIn 0.3s ease;
        }
        .products-section.active-section {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-left: 6px solid #ffb347;
            padding-left: 18px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.8rem;
        }

        .product-card {
            background: #3a3f47;
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.25s, box-shadow 0.25s;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
            border: 1px solid #525c68;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 30px rgba(0,0,0,0.3);
            border-color: #ffb34770;
        }
        .product-img {
            background: #22262c;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            height: 210px;
        }
        .product-img img {
            max-width: 100%;
            max-height: 160px;
            object-fit: contain;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.3));
        }
        .product-info {
            padding: 1rem 1.2rem 1.2rem;
            flex: 1;
        }
        .product-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
            color: white;
        }
        .product-brand {
            font-size: 0.75rem;
            color: #ffb89a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .product-specs {
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .order-btn {
            background: #ffb347;
            border: none;
            width: 100%;
            padding: 10px 0;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #1e2227;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            background: #1e2227;
            margin-top: 2rem;
            border-top: 1px solid #414a54;
            font-size: 0.8rem;
            color: #a1abb5;
        }
    </style>
</head>
<body>
<!-- (Rest of your HTML + JS remains exactly as you sent) -->
</body>
</html>
