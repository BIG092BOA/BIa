<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BIA Gadgets | Premium Tech Emporium</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body { background-color: #2c2f33; color: #f0f3f5; scroll-behavior: smooth; }
        :root { --bg-main: #1e2227; --card-bg: #3a3f47; --accent: #ffb347; }

        .navbar {
            background: var(--bg-main); padding: 1rem 2rem; display: flex; flex-wrap: wrap;
            align-items: center; justify-content: space-between; gap: 1rem;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #414a54;
        }
        .logo { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #FFF, #ffb347); -webkit-background-clip: text; color: transparent; }
        
        .search-bar { flex: 1; max-width: 500px; display: flex; background: #2f353d; border-radius: 60px; overflow: hidden; border: 1px solid #5f6a76; }
        .search-bar input { flex: 1; background: transparent; border: none; padding: 12px 20px; color: white; outline: none; }
        .search-bar button { background: #ffb347; border: none; padding: 0 22px; cursor: pointer; color: #1e2227; }

        .categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; padding: 1rem; background: #23272e; position: sticky; top: 72px; z-index: 99; border-bottom: 1px solid #3b424b; }
        .cat-btn { background: #31373f; border: none; padding: 10px 20px; border-radius: 40px; color: #eef2f5; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .cat-btn.active, .cat-btn:hover { background: #ffb347; color: #1e2227; }

        .products-section { display: none; padding: 2rem; animation: fadeIn 0.4s ease; }
        .products-section.active-section { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem; }
        .product-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #525c68; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: #ffb347; }
        
        .product-img { background: #fff; height: 200px; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .product-img img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .product-info { padding: 1.5rem; }
        .product-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 5px; color: #fff; }
        .product-brand { color: #ffb347; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        .product-specs { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 1.5rem; height: 40px; overflow: hidden; }

        .order-btn { background: #ffb347; border: none; width: 100%; padding: 12px; border-radius: 40px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: #1e2227; }
        .footer { text-align: center; padding: 3rem; background: #1e2227; color: #a1abb5; border-top: 1px solid #414a54; }

        @media (max-width: 700px) { .navbar { flex-direction: column; } .categories { top: 120px; } }
    </style>
</head>
<body>

<header>
    <div class="navbar">
        <div class="logo"><i class="fas fa-bolt"></i> BIA GADGETS</div>
        <div class="search-bar">
            <input type="text" id="globalSearchInput" placeholder="Search gadgets...">
            <button id="globalSearchBtn"><i class="fas fa-search"></i></button>
        </div>
    </div>
    <div class="categories">
        <button class="cat-btn active" data-cat="phones">Phones</button>
        <button class="cat-btn" data-cat="earbuds">Earbuds</button>
        <button class="cat-btn" data-cat="powerbanks">Power Banks</button>
        <button class="cat-btn" data-cat="laptops">Laptops</button>
        <button class="cat-btn" data-cat="routers">Routers</button>
        <button class="cat-btn" data-cat="audio">Audio/Headsets</button>
    </div>
</header>

<main id="mainContent">
    <div id="phones" class="products-section active-section"></div>
    <div id="earbuds" class="products-section"></div>
    <div id="powerbanks" class="products-section"></div>
    <div id="laptops" class="products-section"></div>
    <div id="routers" class="products-section"></div>
    <div id="audio" class="products-section"></div>
</main>

<footer class="footer">
    <p><i class="fab fa-whatsapp"></i> BIA Gadgets - Premium Tech Partner</p>
</footer>

<script>
    // Targeted Image Categories (Using high-quality product keywords)
    const imgKeywords = {
        phones: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=400&auto=format&fit=crop",
        earbuds: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?q=80&w=400&auto=format&fit=crop",
        powerbanks: "https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?q=80&w=400&auto=format&fit=crop",
        laptops: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?q=80&w=400&auto=format&fit=crop",
        routers: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?q=80&w=400&auto=format&fit=crop",
        audio: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=400&auto=format&fit=crop"
    };

    const brands = {
        phones: ["iPhone 15 Pro", "Samsung S24 Ultra", "Tecno Camon 30", "Infinix Note 40", "Redmi Note 13"],
        earbuds: ["Oraimo FreePods 4", "New Age Buds", "Apple AirPods Pro", "Samsung Buds 2"],
        powerbanks: ["Linco 20k", "Oraimo Toast 10", "Anker PowerCore", "New Age Giant"],
        laptops: ["HP EliteBook", "Dell Latitude", "Lenovo Yoga", "MacBook Air M3"],
        routers: ["TP-Link Archer", "Tenda AC1200", "Huawei B535"],
        audio: ["Sony WH-1000XM5", "JBL Live 660", "Bose QuietComfort"]
    };

    function render(cat, search = "") {
        const container = document.getElementById(cat);
        const list = brands[cat] || [];
        const filtered = list.filter(name => name.toLowerCase().includes(search.toLowerCase()));

        container.innerHTML = `
            <div class="product-grid">
                ${filtered.map((name, i) => `
                    <div class="product-card">
                        <div class="product-img">
                            <img src="${imgKeywords[cat]}&sig=${i}" alt="${name}">
                        </div>
                        <div class="product-info">
                            <div class="product-brand">${name.split(' ')[0]}</div>
                            <div class="product-name">${name}</div>
                            <div class="product-specs">High-performance ${cat.slice(0,-1)} with premium warranty.</div>
                            <button class="order-btn" onclick="sendWA('${name}')">
                                <i class="fab fa-whatsapp"></i> ORDER ON WHATSAPP
                            </button>
                        </div>
                    </div>
                `).join('')}
            </div>`;
    }

    function sendWA(item) {
        const phone = "2349121843325";
        const msg = encodeURIComponent(`Hello BIA Gadgets, I want to order: ${item}. Please send price and delivery details.`);
        window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.products-section').forEach(s => s.classList.remove('active-section'));
            const cat = btn.dataset.cat;
            document.getElementById(cat).classList.add('active-section');
            render(cat);
        };
    });

    document.getElementById('globalSearchBtn').onclick = () => {
        const active = document.querySelector('.cat-btn.active').dataset.cat;
        render(active, document.getElementById('globalSearchInput').value);
    };

    // Initial load
    render('phones');
</script>
</body>
</html>
