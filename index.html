<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIA Gadgets | Premium Tech Emporium</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ffb347; /* Beachy Orange Accent */
            --bg: #2c2f33; /* Deep Grey Theme */
            --card-bg: #3a3f47;
            --text-main: #ffffff;
            --text-sub: #b0bec5;
            --accent-hover: #ff9f1c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Sticky Header & Navbar */
        header {
            background: #1e2227;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid #414a54;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #FFFFFF, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Pinterest Style Category Bar */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: #23272e;
            overflow-x: auto;
            white-space: nowrap;
            position: sticky;
            top: 125px; /* Below Header */
            z-index: 999;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: #31373f;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            color: #1e2227;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        .products-section { display: none; animation: fadeIn 0.5s ease; }
        .products-section.active-section { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* The Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
        }

        /* Product Card */
        .product-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid #4e555e;
            position: relative;
        }

        .image-wrapper {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff; /* White background for the "Pinterest Cutout" look */
            border-radius: 18px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .product-card img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        .product-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .product-card:hover img { transform: scale(1.1); }

        .product-info { text-align: center; }
        .product-tag { font-size: 0.7rem; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 5px; display: block; }
        .product-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; }

        .order-btn {
            background: var(--primary);
            color: #1e2227;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .product-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .image-wrapper { height: 160px; }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>BIA GADGETS</h1>
        <p style="color: var(--text-sub)">Premium Quality. Innovative Technology.</p>
    </header>

    <div class="categories">
        <button class="cat-btn active" onclick="showCat('phones', this)">Phones</button>
        <button class="cat-btn" onclick="showCat('audio', this)">Earbuds & Audio</button>
        <button class="cat-btn" onclick="showCat('power', this)">Power Banks</button>
        <button class="cat-btn" onclick="showCat('work', this)">Workstations</button>
        <button class="cat-btn" onclick="showCat('solar', this)">Solar & Battery</button>
    </div>

    <div class="container" id="mainContent">
        </div>

    <script>
        const storeData = {
            phones: {
                brands: ["iPhone", "Samsung", "Tecno", "Infinix", "Redmi", "Google Pixel"],
                keyword: "smartphone",
                tag: "Mobile"
            },
            audio: {
                brands: ["Oraimo", "New Age", "Apple", "JBL", "Sony", "SoundPEATS"],
                keyword: "earbuds",
                tag: "Audio"
            },
            power: {
                brands: ["Linco", "Oraimo", "New Age", "Anker", "Baseus"],
                keyword: "powerbank",
                tag: "Power"
            },
            work: {
                brands: ["Apple MacBook", "HP Elitebook", "Dell Latitude", "Lenovo Yoga"],
                keyword: "laptop",
                tag: "Workstation"
            },
            solar: {
                brands: ["Jackery", "EcoFlow", "Bluetti", "Renogy"],
                keyword: "solarpanel",
                tag: "Energy"
            }
        };

        function generateStore() {
            const container = document.getElementById('mainContent');
            
            Object.keys(storeData).forEach(cat => {
                const section = document.createElement('div');
                section.id = cat;
                section.className = `products-section ${cat === 'phones' ? 'active-section' : ''}`;
                
                let gridHTML = `<div class="product-grid">`;
                
                // Generate 34 items per category as requested
                for (let i = 1; i <= 34; i++) {
                    const brand = storeData[cat].brands[i % storeData[cat].brands.length];
                    const name = `${brand} Pro Series ${i + 100}`;
                    // Pinterest tech-style image fetching
                    const imgUrl = `https://loremflickr.com/400/400/${storeData[cat].keyword}?lock=${cat.length + i}`;
                    
                    gridHTML += `
                        <div class="product-card">
                            <div class="image-wrapper">
                                <img src="${imgUrl}" alt="${name}" loading="lazy">
                            </div>
                            <div class="product-info">
                                <span class="product-tag">${brand}</span>
                                <h3 class="product-name">${name}</h3>
                                <button class="order-btn" onclick="orderWA('${name}')">
                                    <i class="fab fa-whatsapp"></i> ORDER NOW
                                </button>
                            </div>
                        </div>
                    `;
                }
                
                gridHTML += `</div>`;
                section.innerHTML = gridHTML;
                container.appendChild(section);
            });
        }

        function showCat(id, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.querySelectorAll('.products-section').forEach(s => s.classList.remove('active-section'));
            document.getElementById(id).classList.add('active-section');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function orderWA(product) {
            const msg = encodeURIComponent(`Hello BIA Gadgets, I'm interested in ordering: ${product}. Please provide details.`);
            window.open(`https://wa.me/2349121843325?text=${msg}`, '_blank');
        }

        // Initialize
        generateStore();
    </script>

</body>
</html>
